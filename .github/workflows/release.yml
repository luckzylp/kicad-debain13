name: Release

# Only a tag push can publish.  The build and install test run first; the
# publish job is gated by the "release" GitHub Environment (configure required
# reviewers in repository settings).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag and manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1
      - name: Install manifest tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
      - name: Refuse mismatched tags
        run: ./scripts/validate-release-tag.sh

  build:
    name: Build and smoke-test
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      # Set the repository variable KICAD_BUILD_RUNNER to self-hosted-vm to
      # build on a real Debian 13 VM; otherwise a Debian 13 container is used.
      runner: ${{ vars.KICAD_BUILD_RUNNER || 'github-hosted' }}
      scope: arch

  publish:
    name: Publish verified release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 1

      - name: Install manifest tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Download the tested artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kicad-debian13-amd64
          path: dist

      - name: Download the clean-install smoke-test report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kicad-debian13-smoke-test
          path: smoke-reports

      - name: Re-check the tag against the manifest
        run: ./scripts/validate-release-tag.sh

      - name: Verify the checksums produced by the build
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Attach the smoke-test report
        run: |
          set -euo pipefail
          mkdir -p dist/reports
          cp -v smoke-reports/smoke-test.txt dist/reports/

      - name: Generate release notes
        run: ./scripts/make-release-notes.sh

      - name: Regenerate checksums for the unsigned release
        run: |
          set -euo pipefail
          ./scripts/make-checksums.sh
          ( cd dist && sha256sum -c SHA256SUMS )

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source packaging/versions.env
          version="$(dpkg-parsechangelog -l debian/changelog -S Version)"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --latest \
            --title "KiCad ${UPSTREAM_VERSION} for Debian 13 (${ARCHITECTURE})" \
            --notes-file dist/RELEASE-NOTES.md \
            dist/*.deb \
            dist/*.buildinfo \
            dist/*.changes \
            dist/SHA256SUMS \
            dist/build-info.json \
            dist/RELEASE-NOTES.md \
            dist/reports/*
          printf 'published %s for %s\n' "$GITHUB_REF_NAME" "$version"
